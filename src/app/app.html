<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/auction" aria-label="IPL Legends Auction">
      <span class="brand-mark">IPL</span>
      <span>
        <strong>Legends Auction </strong>
        <small>Live mega auction room</small>
      </span>
    </a>

    <nav class="nav-links" aria-label="Primary">
      <a routerLink="/guide" routerLinkActive="active">Guide</a>
      @if (setupAuth.setupAccess()) {
        <a routerLink="/setup" routerLinkActive="active">Setup</a>
      }
      <a routerLink="/join" routerLinkActive="active">Join</a>
      <a routerLink="/auction" routerLinkActive="active">Live Room</a>
      <a routerLink="/dashboard" routerLinkActive="active">Teams</a>
      <!-- <a routerLink="/unsold" routerLinkActive="active">Re-auction</a> -->
      <a routerLink="/summary" routerLinkActive="active">Summary</a>
    </nav>

    <div class="status-pill" [title]="sync.lastError() || sync.status()">
      <span class="pulse"></span>
      {{ store.state().phase | uppercase }}
      @if (session.currentMember(); as member) {
        · OWNER
      }
      @if (sync.enabled) {
        · {{ sync.connected() ? 'SYNC' : 'OFFLINE' }}
      }
    </div>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
