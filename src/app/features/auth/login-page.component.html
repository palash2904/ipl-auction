<section class="page-grid login-page">
  <div class="hero-copy">
    <p class="eyebrow">Secure auction access</p>
    <h1>Login to manage the room.</h1>
    <p>
      Use your auction credentials to enter the setup console and prepare the live
      bidding room.
    </p>
  </div>
  <form class="login-panel" (ngSubmit)="otpSent ? verifyOtp() : sendEmail()">
    <div class="section-head">
      <div>
        <p class="eyebrow">Login</p>
        <h2>Welcome back</h2>
      </div>
    </div>
    <label>
      Email
      <input
        type="email"
        [(ngModel)]="formData.from_email"
        name="from_email"
        placeholder="Email"
        required
        [disabled]="otpSent"
      />
    </label>
    @if (otpSent) {
      <label>
        OTP
        <input
          type="text"
          [(ngModel)]="enteredOtp"
          name="enteredOtp"
          placeholder="Enter OTP"
          inputmode="numeric"
          maxlength="6"
          required
        />
      </label>
    }
    @if (loginError) {
    <div class="alert">{{ loginError }}</div>
    }
    <button class="btn primary" type="submit">
      {{ otpSent ? 'Verify OTP' : 'Send OTP' }}
    </button>
  </form>
</section>
